name: release
# A tag v* runs the tests, builds Scannx-<tag>.zip with Intel PresentMon and publishes a GitHub release.
# Run it by hand (workflow_dispatch) to build the zip as a workflow artifact only, without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version with a nonempty CHANGELOG.md section (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1, like the users
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # the publish step uses GH_TOKEN; no token left in .git/config

      - name: Validate version and release notes before tests or downloads
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $v = if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:INPUT_VERSION }
          if ($v -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') { throw "Invalid release version: $v" }
          $changelog = [IO.File]::ReadAllText((Join-Path $PWD 'CHANGELOG.md'), [Text.Encoding]::UTF8)
          $m = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($v))(?=\s)[^\n]*\n(.*?)(?=^## |\z)")
          if (-not $m.Success -or -not $m.Groups[1].Value.Trim()) { throw "CHANGELOG.md has no nonempty '## $v' section" }
          [IO.File]::WriteAllText((Join-Path $PWD 'notes.md'), $m.Groups[1].Value.Trim(), (New-Object Text.UTF8Encoding($false)))
          "RELEASE_VERSION=$v" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Tests (Pester 3.4)
        run: |
          Install-Module Pester -RequiredVersion 3.4.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 3.4.0
          $res = Invoke-Pester -Script @('tests', '.github/tests') -PassThru
          if ($res.FailedCount) { exit 1 }

      - name: Download PresentMon 2.3.1 (Intel, MIT license)
        run: |
          [Net.ServicePointManager]::SecurityProtocol = 'Tls12'
          Invoke-WebRequest https://github.com/GameTechDev/PresentMon/releases/download/v2.3.1/PresentMon-2.3.1-x64.exe -OutFile PresentMon-2.3.1-x64.exe -UseBasicParsing
          Invoke-WebRequest https://raw.githubusercontent.com/GameTechDev/PresentMon/v2.3.1/LICENSE.txt -OutFile PresentMon-LICENSE.txt -UseBasicParsing

      - name: Build the zip (checks the PresentMon SHA256)
        run: |
          .\tools\build-release.ps1 -Version $env:RELEASE_VERSION -PresentMon PresentMon-2.3.1-x64.exe -PresentMonLicense PresentMon-LICENSE.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scannx-zip
          path: dist/
          if-no-files-found: error

      - name: Attest the release zip
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Publish the GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist -File).FullName --title "Scannx $($env:GITHUB_REF_NAME)" --notes-file notes.md
          if ($LASTEXITCODE) { throw "gh release create failed with exit code $LASTEXITCODE" }
